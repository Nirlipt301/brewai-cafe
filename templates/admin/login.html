<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BrewAI Admin Login</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{url_for('static',filename='css/staff.css')}}"></head><body class="staff-login-body admin-login"><div class="login-visual"><div class="login-word">CONTROL</div><p>Every order. Every insight. One view.</p></div><div class="staff-login-card"><div class="staff-mark">Brew<span>AI</span> · Admin</div><p class="kicker">MANAGEMENT ACCESS</p><h1>Run the café.<br>See the whole picture.</h1><p class="muted">Administrator accounts only.</p>{% with msgs=get_flashed_messages(with_categories=true) %}{% for c,m in msgs %}<div class="staff-flash {{c}}">{{m}}</div>{% endfor %}{% endwith %}<form method="post" class="staff-form"><label>Email<input type="email" name="email" required placeholder="admin@brewai.com"></label><label>Password<input type="password" name="password" required></label><button type="submit">Open Control Center</button></form><a class="back" href="/">← Customer website</a></div></body></html>

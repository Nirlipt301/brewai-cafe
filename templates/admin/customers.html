<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customers · BrewAI Admin</title><link rel="stylesheet" href="{{url_for('static',filename='css/staff.css')}}"></head><body><div class="admin-shell">{% include 'admin/sidebar.html' %}<main class="admin-main"><div class="admin-head"><div><p class="kicker">CUSTOMER CRM</p><h1>Customers</h1></div></div><section class="admin-panel"><div class="table-wrap"><table><thead><tr><th>Customer</th><th>Phone</th><th>Orders</th><th>Spent</th><th>BrewPoints</th><th>Birthday</th></tr></thead><tbody>{% for c in customers %}<tr><td><b>{{c.name}}</b><br><small>{{c.email}}</small></td><td>{{c.phone or '—'}}</td><td>{{c.orders}}</td><td>₹{{c.spent}}</td><td>{{c.loyalty_points}}</td><td>{% if c.birthday_verified %}✓ Verified{% else %}Not verified{% endif %}</td></tr>{% endfor %}</tbody></table></div></section></main></div></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Table QR Codes · BrewAI</title><link rel="stylesheet" href="{{url_for('static',filename='css/staff.css')}}"></head><body><div class="admin-shell">{% include 'admin/sidebar.html' %}<main class="admin-main"><div class="admin-head"><div><p class="kicker">DINE-IN ORDERING</p><h1>Table QR codes</h1><p class="muted">Print these for café tables. Each QR opens BrewAI with that table already selected.</p></div></div><div class="qr-admin-grid">{% for n in tables %}<article class="table-qr"><h2>Table {{'%02d'|format(n)}}</h2><div class="qr-target" data-url="{{request.url_root.rstrip('/')}}/table/{{n}}"></div><code>/table/{{n}}</code></article>{% endfor %}</div></main></div><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script>document.querySelectorAll('.qr-target').forEach(el=>new QRCode(el,{text:el.dataset.url,width:130,height:130}));</script></body></html>

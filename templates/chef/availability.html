<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kitchen Availability</title><link rel="stylesheet" href="{{url_for('static',filename='css/staff.css')}}"></head><body><header class="staff-top"><div><b>☕ BrewAI</b><span>Kitchen Display</span></div><div><a href="/chef">Orders</a> · <a href="/logout">Logout</a></div></header><main class="staff-main"><div class="staff-heading"><div><p class="kicker">MENU CONTROL</p><h1>Item availability</h1></div><a class="outline-btn" href="/chef">← Kitchen board</a></div><div class="availability-grid">{% for p in products %}<article class="availability-card"><div class="avail-icon"><img src="{{ url_for('static', filename='images/' + p[5]) }}" alt="{{p[1]}}" class="staff-product-img"></div><div><b>{{p[1]}}</b><p>{{p[2]}} · ₹{{p[4]}}</p></div><form method="post" action="{{url_for('chef.toggle_availability',pid=p[0])}}"><button class="{% if states.get(p[0],1) %}available{% else %}unavailable{% endif %}">{% if states.get(p[0],1) %}● Available{% else %}● Out of stock{% endif %}</button></form></article>{% endfor %}</div></main></body></html>

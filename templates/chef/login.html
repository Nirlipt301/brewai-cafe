<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BrewAI Kitchen Login</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{url_for('static',filename='css/staff.css')}}"></head><body class="staff-login-body kitchen-login"><div class="login-visual"><div class="login-word">KITCHEN</div><p>Orders in. Focus on. Coffee out.</p></div><div class="staff-login-card"><div class="staff-mark">Brew<span>AI</span> · Kitchen</div><p class="kicker">STAFF ACCESS</p><h1>Ready for<br>the next order?</h1><p class="muted">Chef accounts only. Your kitchen queue is waiting.</p>{% with msgs=get_flashed_messages(with_categories=true) %}{% for c,m in msgs %}<div class="staff-flash {{c}}">{{m}}</div>{% endfor %}{% endwith %}<form method="post" class="staff-form"><label>Email<input type="email" name="email" required placeholder="chef1@brewai.com"></label><label>Password<input type="password" name="password" required></label><button>Enter Kitchen</button></form><a class="back" href="/">← Customer website</a></div></body></html>
